<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>翻棋 Demo v1.0</title>
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <div class="gate" id="gate">
    <form class="gate-card" id="gate-form">
      <div class="gate-brand">
        <svg class="logo" viewBox="0 0 96 96" aria-hidden="true">
          <circle cx="48" cy="48" r="44" fill="none" stroke="#e8c98a" stroke-width="2"></circle>
          <circle cx="48" cy="48" r="36" fill="#2a140f" stroke="#8d642e" stroke-width="3"></circle>
          <text x="48" y="58" text-anchor="middle" fill="#f6edd8" font-size="32" font-family="KaiTi, STKaiti, serif">翻</text>
        </svg>
        <div>
          <h1>翻棋</h1>
          <p class="gate-kicker">揭棋对弈</p>
        </div>
      </div>
      <p class="gate-lead" id="gate-lead">注册后，下完的对局记在这台电脑的数据库里。游客只留在这台浏览器。</p>
      <label>账号<input name="username" id="gate-user" autocomplete="username" maxlength="16"></label>
      <label>密码<input name="password" id="gate-pass" type="password" autocomplete="current-password" maxlength="64"></label>
      <p class="gate-error" id="gate-error" role="alert"></p>
      <div class="gate-actions">
        <button type="submit" class="btn primary" id="gate-login">登录</button>
        <button type="button" class="btn" id="gate-register">注册</button>
        <button type="button" class="btn ghost" id="gate-guest">游客进入</button>
      </div>
    </form>
  </div>

  <div class="app" id="app" hidden>
    <aside class="sidebar">
      <div class="brand">翻棋</div>
      <nav class="nav" aria-label="功能">
        <button type="button" class="nav-btn active" data-mode="local" aria-current="page">本地对弈</button>
        <button type="button" class="nav-btn" data-mode="ai">人机对弈</button>
        <button type="button" class="nav-btn" data-mode="online">联机对弈</button>
        <button type="button" class="nav-btn" data-mode="rank">对弈排名</button>
      </nav>
      <div class="sidebar-foot">
        <span class="account-name" id="account-name" hidden></span>
        <button type="button" class="nav-btn" id="btn-logout" hidden>退出</button>
        <button type="button" class="nav-btn" id="btn-sound" aria-pressed="true">声音</button>
      </div>
    </aside>
    <section class="chat" id="chat" hidden>
      <p class="chat-title">对局聊天</p>
      <div class="chat-log" id="chat-log"></div>
      <div class="emoji-bar" id="emoji-bar"></div>
      <form class="chat-form" id="chat-form">
        <input id="chat-input" maxlength="80" placeholder="说一句" autocomplete="off">
        <button type="submit" class="btn primary">发送</button>
      </form>
    </section>

    <main class="stage">
      <div class="scoreboard" id="scoreboard">
        <div class="side red" id="plate-red"></div>
        <div class="turn-block">
          <p class="turn-banner" id="turn-banner">红方的回合</p>
          <p class="turn-seat" id="turn-seat" hidden></p>
        </div>
        <div class="side black" id="plate-black"></div>
      </div>
      <p class="coach" id="coach" role="status">点一枚亮金边的棋。</p>
      <div class="lobby" id="lobby" hidden>
        <p id="lobby-status">自己起一个房间号，比如 K7MP，然后点开房。验证码会写在这里。</p>
        <div class="room-pair" id="room-pair" hidden>
          <div><span>房间号</span><b id="room-code"></b></div>
          <div class="verify"><span>验证码</span><b id="room-verify"></b></div>
        </div>
        <div class="lobby-actions">
          <label>房间号<input id="host-code" maxlength="4" autocomplete="off" placeholder="K7MP"></label>
          <button type="button" class="btn primary" id="btn-host">开房</button>
        </div>
        <div class="lobby-actions">
          <label>房间号<input id="join-code" maxlength="4" autocomplete="off" placeholder="K7MP"></label>
          <label>验证码<input id="join-verify" maxlength="4" autocomplete="off" placeholder="开房后的验证码"></label>
          <button type="button" class="btn" id="btn-join">加入</button>
        </div>
      </div>
      <div class="board-frame">
        <div class="board-stack">
          <div class="file-row" id="files-black" aria-hidden="true"></div>
          <div class="board" id="board">
            <svg id="grid" class="grid" aria-hidden="true"></svg>
            <div class="river" aria-hidden="true"><span>楚 河</span><span>漢 界</span></div>
            <div class="points" id="points"></div>
            <div class="pieces" id="pieces"></div>
          </div>
          <div class="file-row" id="files-red" aria-hidden="true"></div>
        </div>
      </div>
      <div class="dock">
        <div class="actions">
          <button type="button" class="btn" id="btn-undo">悔棋</button>
          <button type="button" class="btn" id="btn-resign">认输</button>
          <button type="button" class="btn" id="btn-new">重开</button>
          <button type="button" class="btn ghost" id="btn-rules">规则</button>
        </div>
      </div>
    </main>
  </div>

  <div id="fx" class="fx" hidden>
    <div class="fx-stage" role="alertdialog" aria-modal="true" aria-labelledby="fx-title">
      <p class="fx-caption" id="fx-title"></p>
      <p class="fx-sub" id="fx-sub" hidden></p>
      <div class="fx-actions" id="fx-actions" hidden>
        <button type="button" class="btn" id="fx-close">看看棋盘</button>
        <button type="button" class="btn primary" id="fx-again">再来一局</button>
      </div>
    </div>
  </div>

  <dialog id="modal">
    <form method="dialog">
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button type="submit" class="btn" id="modal-cancel" value="cancel">取消</button>
        <button type="submit" class="btn primary" id="modal-ok" value="ok">确定</button>
      </div>
    </form>
  </dialog>

  <template id="rules-template">
    <div class="rules">
      <h4>怎么走</h4>
      <p>亮金边的是你能点的棋。点中之后，绿点是空位，红圈是吃明子，紫圈是吃暗子。暗子落地才翻面，并按它脚下原来的棋种走这一步。</p>
      <h4>翻吃</h4>
      <ul>
        <li>借刀杀人：揭开的是对方，吃掉的也是对方。</li>
        <li>自欺欺人：揭开的是己方，吃掉的也是己方。</li>
        <li>误杀：明子吃到己方暗子，记一枚污点。</li>
        <li>引狼入室：揭出敌子，还吃了己方。</li>
        <li>敌子现形：走到空格才发现是对方的，这枚棋归对方。</li>
      </ul>
      <h4>污点</h4>
      <p>满三枚污点会自爆，变成对方的棋，将帅除外。将帅误杀两次弹出昏君，对局继续。</p>
      <p>吃掉对方将帅、将死、困毙或认输分胜负。未翻面的棋按原位走，可以送将，也可以走开形成飞将。已经翻开的棋不能送将，也不能飞将。明子飞将的格子会标成「飞」。</p>
    </div>
  </template>

  <noscript>需要打开 JavaScript 才能下这局翻棋。</noscript>
  <script src="js/engine.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
